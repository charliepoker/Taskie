version: "3.8"

services:
  # Test PostgreSQL Database
  postgres-test:
    image: postgres:15-alpine
    container_name: taskie-postgres-test
    environment:
      POSTGRES_DB: taskie_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Test Redis Cache
  redis-test:
    image: redis:7-alpine
    container_name: taskie-redis-test
    ports:
      - "6380:6379"
    volumes:
      - redis_test_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_test_data:
  redis_test_data:
